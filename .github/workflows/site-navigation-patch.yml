name: Apply project navigation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = '''\n.web-services{padding-top:80px}.web-services-box{background:#111;color:#fff;border-radius:34px;padding:70px}.web-services-head{display:flex;justify-content:space-between;gap:40px;align-items:end}.web-services-head h2{font-size:clamp(48px,6vw,82px);line-height:.88;letter-spacing:-.075em;margin-top:14px}.web-services-head p{max-width:360px;color:#999;font-size:13px;line-height:1.7}.service-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:48px}.service-card{padding:28px;border:1px solid #292929;border-radius:20px;transition:.3s}.service-card:hover{transform:translateY(-4px);border-color:#444}.service-card small{display:block;color:#666;font-size:9px;letter-spacing:1.8px;margin-bottom:22px}.service-card h3{font-size:25px;letter-spacing:-.04em;margin-bottom:8px}.service-card p{color:#999;font-size:12px;line-height:1.7}.service-link{display:inline-flex;margin-top:25px;padding:10px 14px;border:1px solid #343434;border-radius:999px;font-size:10px}.service-link:hover{background:#fff;color:#111}@media(max-width:850px){.web-services-box{padding:45px 30px}.web-services-head{display:block}.web-services-head p{margin-top:20px}.service-grid{grid-template-columns:1fr}}\n'''
          if '.web-services{' not in s:
              s=s.replace('</style>',css+'</style>',1)

          s=s.replace('<a href="#stack">Stack</a><a href="#contact">İletişim</a>', '<a href="#stack">Stack</a><a href="web-siteleri.html">Web Siteleri</a><a href="#contact">İletişim</a>', 1)

          section='''\n<section id="web-sites" class="section web-services">\n  <div class="web-services-box reveal">\n    <div class="web-services-head">\n      <div><span class="eyebrow" style="color:#777">02 / WEB DEVELOPMENT</span><h2>Markaları<br><em>dijitalde</em> büyütüyorum</h2></div>\n      <p>Kurumsal, kişisel ve özel web sitelerini tasarlıyor, geliştiriyor ve yayına hazırlıyorum. Hazır şablon yerine markaya göre tasarlanmış deneyimler.</p>\n    </div>\n    <div class="service-grid">\n      <div class="service-card"><small>01 / BUSINESS</small><h3>Kurumsal Web Sitesi</h3><p>Şirketin güvenilirliğini ve marka kimliğini yansıtan modern responsive web siteleri.</p><a class="service-link" href="web-siteleri.html">Detayları gör →</a></div>\n      <div class="service-card"><small>02 / PERSONAL</small><h3>Kişisel Web Sitesi</h3><p>Portföy, CV ve kişisel marka için özel tasarım ve geliştirme.</p><a class="service-link" href="web-siteleri.html">Detayları gör →</a></div>\n      <div class="service-card"><small>03 / CAMPAIGN</small><h3>Landing Page</h3><p>Ürün, hizmet ve kampanyalar için tek hedefe odaklanan sayfalar.</p><a class="service-link" href="web-siteleri.html">Detayları gör →</a></div>\n      <div class="service-card"><small>04 / CUSTOM</small><h3>Özel Web Projeleri</h3><p>İhtiyaca göre kurgulanan özel arayüzler, akışlar ve web tabanlı sistemler.</p><a class="service-link" href="web-siteleri.html">Detayları gör →</a></div>\n    </div>\n  </div>\n</section>\n'''
          if 'id="web-sites"' not in s:
              s=s.replace('<section id="about"', section+'<section id="about"', 1)

          old='''document.querySelectorAll('.project').forEach(p=>p.addEventListener('click',()=>openProject(p.dataset.project)));'''
          new='''document.querySelectorAll('.project').forEach(p=>p.addEventListener('click',()=>{if(p.dataset.project==='locamo'){window.location.href='locamo.html';return}if(p.dataset.project==='portfolio'){window.location.href='web-siteleri.html';return}openProject(p.dataset.project)}));'''
          s=s.replace(old,new,1)
          s=s.replace("<a class=\"modal-link\" href=\"https://github.com/erezatmacaa-coder\" target=\"_blank\" rel=\"noreferrer\">GitHub'da incele ↗</a>","",1)
          s=s.replace('<section id="about"', '<section id="about"', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Add project pages and web services"; git push; fi
