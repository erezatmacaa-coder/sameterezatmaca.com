name: Fix Site Layout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/fix-site-layout.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair HTML layout and CTAs
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # Remove every CTA accidentally placed inside the service cards/nav.
          s = re.sub(r'<a\b[^>]*class=["\']service-link["\'][^>]*>.*?</a>', '', s, flags=re.I | re.S)
          s = re.sub(r'<div\s+class=["\']main-web-details-cta["\'][\s\S]*?</div>', '', s, flags=re.I)
          s = re.sub(r'<a\b[^>]*>\s*Web\s+çalışmalarını\s+incele\s*</a>', '', s, flags=re.I)

          # Remove the CTA from the navigation even if its wrapper was malformed.
          s = re.sub(r'<[^>]*main-web-details-cta[^>]*>[\s\S]*?</[^>]+>', '', s, flags=re.I)

          # Insert exactly one CTA immediately after the Web Development service grid.
          cta = '<div class="main-web-details-cta"><a href="web-siteleri.html">DETAYLARI GÖR <span>→</span></a></div>'
          web_section = re.search(r'(<section[^>]*class=["\'][^"\']*web-services[^"\']*["\'][\s\S]*?</section>)', s, flags=re.I)
          if web_section:
              block = web_section.group(1)
              block = re.sub(r'<div\s+class=["\']main-web-details-cta["\'][\s\S]*?</div>', '', block, flags=re.I)
              grid_close = block.rfind('</div>')
              section_close = block.rfind('</section>')
              if grid_close != -1 and section_close != -1 and grid_close < section_close:
                  block = block[:grid_close + 6] + '\n    ' + cta + '\n  ' + block[grid_close + 6:]
                  s = s[:web_section.start(1)] + block + s[web_section.end(1):]

          # Fix the visual overlap with a narrowly scoped layout patch.
          style_patch = '''\n/* Final web-services layout repair */\n.web-services{clear:both;position:relative;}\n.web-services-box{position:relative;display:block;overflow:hidden;}\n.web-services-head,.service-grid,.main-web-details-cta{position:relative;z-index:1;}\n.service-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:48px;align-items:stretch;}\n.service-card{position:relative;min-width:0;height:100%;}\n.service-link{display:none!important;}\n.main-web-details-cta{margin:32px 0 0;display:flex!important;justify-content:center!important;width:100%;}\n.main-web-details-cta a{display:inline-flex;align-items:center;gap:14px;border:1px solid #fff;background:transparent;color:#fff;padding:14px 20px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.8px;transition:.25s;}\n.main-web-details-cta a:hover{background:#fff;color:#111;transform:translateY(-2px);}\n@media(max-width:850px){.service-grid{grid-template-columns:1fr;}.main-web-details-cta{margin-top:28px;}}\n'''
          if '/* Final web-services layout repair */' not in s:
              s = s.replace('</style>', style_patch + '</style>', 1)

          # Keep product naming consistent in visible site content.
          s = re.sub(r'(?<![A-Za-z])MOVA(?![A-Za-z])', 'Nerio', s)
          s = re.sub(r'(?<![A-Za-z])Mova(?![A-Za-z])', 'Nerio', s)

          p.write_text(s, encoding='utf-8')
          print('changed:', s != original)

      - name: Verify
        shell: bash
        run: |
          set -e
          test -f index.html
          count=$(grep -o 'main-web-details-cta' index.html | wc -l)
          echo "CTA block occurrences: $count"
          test "$count" -ge 1
          if grep -qi 'class="service-link"' index.html; then
            echo 'Per-card CTA remains.'
            exit 1
          fi
          if grep -qi 'Web çalışmalarını incele' index.html; then
            echo 'Secondary web CTA remains.'
            exit 1
          fi

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Repair web section layout and single CTA'
          git push
