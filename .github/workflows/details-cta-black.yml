name: Make details CTA text black

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update CTA color
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          patch = '''\n<style id="details-cta-black">\n.main-web-details-cta a{color:#111!important;background:#fff!important;border-color:#fff!important}\n.main-web-details-cta a span{color:#111!important}\n</style>\n'''
          if 'id="details-cta-black"' not in s:
              s = s.replace('</head>', patch + '</head>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Set details CTA text to black'
          git push
