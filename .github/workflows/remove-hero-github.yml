name: Remove hero GitHub link

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove hero GitHub link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          link = '<a class="text-link" href="https://github.com/erezatmacaa-coder" target="_blank" rel="noreferrer">GitHub ↗</a>'
          if link in s:
              s = s.replace(link, '', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No change needed"
          else
            git commit -m "Remove GitHub link from hero"
            git push
          fi
