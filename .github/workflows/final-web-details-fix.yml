name: Final web details CTA fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize the web-project details CTA
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('web-siteleri.html')
          html = path.read_text(encoding='utf-8')

          start = html.find('<section class="portfolio">')
          if start == -1:
              raise SystemExit('portfolio section not found')
          end = html.find('</section>', start)
          if end == -1:
              raise SystemExit('portfolio section closing tag not found')

          section = html[start:end]

          # Remove every existing details CTA in the portfolio section,
          # including anchors, buttons, bold labels and nested spans.
          detail_text = r'(?:DETAYLARI\s*(?:GÖR|İNCELE|INCELE)|DETAYLARINI\s*(?:GÖR|İNCELE|INCELE))'
          for tag in ('a', 'button', 'b', 'strong', 'span'):
              section = re.sub(
                  rf'<{tag}\b[^>]*>\s*{detail_text}\s*(?:<span\b[^>]*>.*?</span>\s*)*</{tag}>',
                  '', section, flags=re.I | re.S
              )

          # Remove any previous shared CTA blocks.
          section = re.sub(
              r'<div\b[^>]*class=["\'][^"\']*project-details-cta[^"\']*["\'][^>]*>.*?</div>',
              '', section, flags=re.I | re.S
          )

          # Also remove generic elements whose visible text is exactly a details CTA.
          section = re.sub(
              rf'<([a-z0-9]+)\b[^>]*>\s*{detail_text}\s*</\1>',
              '', section, flags=re.I | re.S
          )

          # One and only one CTA, after the project cards.
          cta = '<div class="project-details-cta"><a href="#contact">DETAYLARI GÖR <span>→</span></a></div>'
          section = section.rstrip() + cta

          html = html[:start] + section + html[end:]

          # Ensure only one CTA style block exists.
          html = re.sub(r'\n?\.project-details-cta\{.*?</style>', '', html, count=1, flags=re.S)
          style = '.project-details-cta{margin-top:34px;display:flex;justify-content:flex-end}.project-details-cta a{display:inline-flex;align-items:center;gap:18px;background:#111;color:#fff;padding:15px 20px;border-radius:999px;font-size:12px;font-weight:800;transition:.25s}.project-details-cta a:hover{transform:translateY(-2px)}\n'
          html = html.replace('</style>', style + '</style>', 1)

          path.write_text(html, encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-siteleri.html
          if git diff --cached --quiet; then
            echo "No change needed"
            exit 0
          fi
          git commit -m "Normalize single web details CTA [skip ci]"
          git push
