name: Fix Web Services Layout

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/fix-web-services-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair web services section
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          html=re.sub(r'<div class="main-web-details-cta">\s*<a href="web-siteleri\.html">\s*DETAYLARI GÖR\s*<span>→</span>\s*</a>\s*</div>','',html,flags=re.I)
          html=re.sub(r'\s*<a class="service-link" href="web-siteleri\.html">\s*Detayları gör\s*→\s*</a>','',html,flags=re.I)
          html=re.sub(r'\s*<div class="main-web-details-cta">.*?</div>','',html,flags=re.I|re.S)
          start=html.find('<section id="web-sites"')
          end=html.find('</section>',start)
          if start>=0 and end>=0:
            section=html[start:end]
            cta='\n    <div class="main-web-details-cta"><a href="web-siteleri.html">DETAYLARI GÖR <span>→</span></a></div>\n'
            pos=section.rfind('</div>')
            section=section[:pos+6]+cta+section[pos+6:]
            html=html[:start]+section+html[end:]
          css='''\n.web-services-box{position:relative;overflow:hidden}.web-services .service-grid{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:48px}.web-services .service-card{position:relative;min-width:0}.main-web-details-cta{position:relative;display:flex;justify-content:center;margin:34px 0 0}.main-web-details-cta a{display:inline-flex;align-items:center;gap:18px;border:1px solid #454545;background:transparent;color:#fff;padding:14px 20px;border-radius:999px;font-size:12px;font-weight:800}.main-web-details-cta a:hover{background:#fff;color:#111}@media(max-width:850px){.web-services .service-grid{grid-template-columns:1fr;gap:12px}}\n'''
          html=html.replace('</style>',css+'</style>',1)
          p.write_text(html,encoding='utf-8')
          start=html.find('<section id="web-sites"');end=html.find('</section>',start);section=html[start:end]
          assert section.count('main-web-details-cta')==1
          assert section.lower().count('service-link')==0
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix web services layout and single CTA'
          git push
