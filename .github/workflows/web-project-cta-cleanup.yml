name: Clean web project CTAs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep one bottom details CTA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('web-siteleri.html')
          if not path.exists():
              raise SystemExit('web-siteleri.html not found')

          html = path.read_text(encoding='utf-8')

          project_start = html.find('<section class="portfolio">')
          if project_start == -1:
              raise SystemExit('portfolio section not found')
          project_end = html.find('</section>', project_start)
          if project_end == -1:
              raise SystemExit('portfolio section end not found')

          section = html[project_start:project_end]

          # Remove any existing per-card "Detayları Gör" links/buttons.
          section = re.sub(
              r'<a\b[^>]*>\s*(?:DETAYLARI GÖR|Detayları Gör|DETAYLARI INCELE|Detayları İncele)\s*</a>',
              '', section, flags=re.I
          )
          section = re.sub(
              r'<button\b[^>]*>\s*(?:DETAYLARI GÖR|Detayları Gör|DETAYLARI INCELE|Detayları İncele)\s*</button>',
              '', section, flags=re.I
          )

          # Remove a previous shared CTA before adding the final one.
          section = re.sub(
              r'<div class="project-details-cta".*?</div>',
              '', section, flags=re.S
          )

          # One single CTA beneath the project cards.
          cta = '''<div class="project-details-cta"><a href="#contact">Detayları gör <span>→</span></a></div>'''
          section += cta

          html = html[:project_start] + section + html[project_end:]

          if 'project-details-cta' not in html.split('</style>', 1)[0]:
              html = html.replace(
                  '</style>',
                  '''\n.project-details-cta{margin-top:34px;display:flex;justify-content:flex-end}.project-details-cta a{display:inline-flex;align-items:center;gap:18px;background:#111;color:#fff;padding:15px 20px;border-radius:999px;font-size:12px;font-weight:800;transition:.25s}.project-details-cta a:hover{transform:translateY(-2px)}\n</style>''',
                  1
              )

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-siteleri.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Use one shared project details CTA [skip ci]"
          git push
